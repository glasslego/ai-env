# ai-env 메인 설정
version: "1.0"

# 기본 에이전트
default_agent: codex

# 환경변수 소스 파일
env_file: ".env"

# Codex 기본 모델 설정
codex_model: gpt-5.5
codex_model_reasoning_effort: xhigh

# cmux 터미널 연동 (cmux 훅 동기화 on/off)
# true: settings.json에 cmux 훅 포함 + cmux_notify.sh 동기화
# false: cmux 훅 제거, cmux_notify.sh 동기화 스킵
cmux_enabled: true

# === AI Providers ===
# 사용 범위: Claude Code + Codex (SPEC-013).
# 다른 도구는 본 코드베이스에서 더 이상 지원하지 않는다.
providers:
  claude:
    enabled: true
    env_key: ANTHROPIC_API_KEY

  codex:
    enabled: true
    env_key: OPENAI_API_KEY

# === Agent 우선순위 (claude --fallback) ===
# claude --fallback이 이 순서대로 에이전트를 시도
# 앞의 에이전트가 세션 한도/에러로 종료되면 다음 에이전트로 자동 전환
# "agent:model" 형식으로 모델 지정 가능 (예: claude:sonnet → claude --model sonnet)
agent_priority:
  - claude           # Opus (default model)
  - claude:sonnet    # Claude with --model sonnet
  - codex

# Fallback 세션 로그/핸드오프 저장 경로
# 현재 프로젝트의 .claude/logs/ 에 저장 (프로젝트별 로컬)
# 미설정 시 macOS temp 사용 후 삭제 (기존 동작)
# 환경변수 CLAUDE_FALLBACK_LOG_DIR로 오버라이드 가능
fallback_log_dir: .claude/logs

# Obsidian vault 루트 (ai-env session save / megan-skills 에서 사용)
# 미설정 시 ~/Documents/Obsidian Vault 사용 (공백 포함, megan 실제 경로)
obsidian_base: ~/Documents/Obsidian Vault

# === 출력 경로 (글로벌 설정) ===
outputs:
  # Desktop 앱
  claude_desktop: ~/Library/Application Support/Claude/claude_desktop_config.json
  codex_desktop: ~/.codex/codex.config.json

  # CLI 도구 (글로벌)
  claude_global: ~/.claude/settings.json
  codex_global: ~/.codex/config.toml

  # 로컬 프로젝트 설정 (glocal = 다른 프로젝트용 템플릿)
  claude_local: ./.claude/settings.glocal.json
  codex_local: ./.codex/config.toml

  # 기타
  shell_exports: ./generated/shell_exports.sh

# === Extra credentials (.env 관리, github 업로드 절대 금지) ===
# providers / mcp_servers 가 직접 안 쓰지만 코드가 .env 에서 읽는 키들.
# 여기 추가된 key 는 `ai-env sync` 시 .env.example 에 placeholder 로 자동 반영된다.
# 실제 값은 .env 에서만 관리 (gitignored, 600 권한 권장).
extra_env_keys:
  - key: GOOGLE_API_KEY
    description: "Used by: research.py (Track B Gemini Deep Research)"
  - key: ECOS_API_KEY
    description: "한국은행 ECOS Open API (https://ecos.bok.or.kr/api/)"
